name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot
          POSTGRES_DB: datapilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
      POSTGRES_DB: datapilot_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ''
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_TIMEOUT_SECONDS: 30
      OPENAI_MAX_RETRIES: 2
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Verify Alembic migration state
        run: |
          python -m alembic current
          python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build production frontend
        run: npm run build

  docker:
    name: Docker images
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create temporary backend environment
        shell: bash
        run: |
          printf '%s\n' \
            'APP_NAME=DataPilot-AI' \
            'APP_VERSION=0.1.0' \
            'ENVIRONMENT=ci' \
            'POSTGRES_USER=datapilot' \
            'POSTGRES_PASSWORD=datapilot' \
            'POSTGRES_DB=datapilot_test' \
            'POSTGRES_HOST=db' \
            'POSTGRES_PORT=5432' \
            'REDIS_URL=redis://redis:6379/0' \
            'OPENAI_API_KEY=' \
            'OPENAI_MODEL=gpt-4o-mini' \
            'OPENAI_TIMEOUT_SECONDS=30' \
            'OPENAI_MAX_RETRIES=2' > backend/.env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Remove temporary backend environment
        if: always()
        shell: bash
        run: rm -f backend/.env