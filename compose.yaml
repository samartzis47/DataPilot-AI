services:
  db:
    image: postgres:17.10-alpine
    container_name: datapilot-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: datapilot-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend

    container_name: datapilot-worker
    restart: unless-stopped

    command:
      [
        "celery",
        "-A",
        "app.core.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend/storage:/app/storage

volumes:
  postgres_data:
  redis_data: